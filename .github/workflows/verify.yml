name: Verify
# DIAG(diag-quit-timeout)：诊断分支专用，只跑 quit-timeout-p42，永不合并
on:
  push:
  workflow_dispatch:
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: win-alone, n: 10, scope: alone }
          - { os: windows-latest, name: win-with-default, n: 3, scope: default }
          - { os: ubuntu-24.04, name: linux-alone, n: 3, scope: alone }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env: { INKSTONE_QUIT_DIAG: '1' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - shell: bash
        run: |
          fails=0
          for i in $(seq 1 ${{ matrix.n }}); do
            echo "=== ITER $i ${{ matrix.name }} ==="
            if [ "${{ matrix.scope }}" = alone ]; then
              npx vitest run tests/quit-timeout-p42.test.ts --project default || { echo "ITER $i RED"; fails=$((fails+1)); }
            else
              npx vitest run --project default || { echo "ITER $i RED"; fails=$((fails+1)); }
            fi
          done
          echo "TOTAL_FAILS=$fails of ${{ matrix.n }}"
          [ $fails -eq 0 ]

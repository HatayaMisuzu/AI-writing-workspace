name: Verify

# diag-hw1 诊断分支：临时只跑检查点相关单测（重复），两平台
on:
  push:
  workflow_dispatch:

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json || true
        continue-on-error: true
      - name: diag loops
        shell: bash
        env:
          G_ONLY: ${{ matrix.os == 'windows-latest' && '6' || '15' }}
          PAIR: ${{ matrix.os == 'windows-latest' && '1' || '2' }}
          FULL: '1'
        run: bash scripts/ci/diag-hw1.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diag-hw1-${{ matrix.os }}
          path: diag-out/

name: Verify

# 诊断分支 diag-thousand-chapter-keystroke（永不合并）：只跑千章书按键剖析 e2e。
# profiling=0：生产构建（真实耗时）；profiling=1：react-dom/profiling + <Profiler onRender> 计数（有额外开销，只看次数/占比）
on:
  push:
  workflow_dispatch:

jobs:
  diag-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profiling: ['0', '1']
    env:
      INKSTONE_DIAG_KEYSTROKE: '1'
      VITE_DIAG_KEYSTROKE: ${{ matrix.profiling }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diag-windows-profiling${{ matrix.profiling }}
          path: e2e-artifacts/
          if-no-files-found: warn

  diag-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profiling: ['0', '1']
    env:
      INKSTONE_DIAG_KEYSTROKE: '1'
      VITE_DIAG_KEYSTROKE: ${{ matrix.profiling }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a dbus-run-session -- bash scripts/ci/linux-e2e.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diag-linux-profiling${{ matrix.profiling }}
          path: e2e-artifacts/
          if-no-files-found: warn
